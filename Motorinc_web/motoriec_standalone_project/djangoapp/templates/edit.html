{% extends 'base.html' %}

{% block title %}Edit Spare - Motoriec{% endblock %}

{% block content %}
<section class="content-card narrow-card">
    <h2>Edit Spare Part</h2>
    <form method="post" class="data-form">
        {% csrf_token %}

        <label for="name">Spare name</label>
        <input type="text" id="name" name="name" value="{{ spare.name }}" required>

        <label for="category">Category</label>
        <input type="text" id="category" name="category" value="{{ spare.category }}" required>

        <label for="price">Price (INR)</label>
        <input type="number" id="price" name="price" value="{{ spare.price }}" min="0" step="0.01" required>

        <label for="stock">Stock</label>
        <input type="text" id="stock" name="stock" value="{{ spare.stock }}" required>

        <button class="button" type="submit">Update Spare</button>
        <a class="button button-secondary" href="{% url 'spares' %}">Cancel</a>
    </form>
</section>
{% endblock %}
